# Rebuilds the route-use evidence database for
# /srv/openlooper/evidence/evidence-region.osm.pbf, the sub-region that
# 51-region-prepare-job.yaml cut out of the routing PBF.
#
# Four steps, each resumable:
#
#   fetch-gps   downloads and md5-checks the 21 GB archive (kept afterwards)
#   prefilter   one pass over it, keeping only members that could hold a
#               coordinate in this region, written uncompressed
#   tile        cuts the region into tiles, splitting any that are too big
#   partition   splits the intermediate into one archive per tile
#   build       one prepare_evidence.py per tile, then merges them
#
# The prefilter exists because decompressing 21 GB of xz is single-core: a floor
# of about forty minutes. Inflating once removes that from every tile.
#
# The partition exists because what was left still had to be read in full by
# every tile. At 23 GB that is fourteen minutes each, so thirty tiles spent
# seven hours reading the same bytes to discard almost all of them. Splitting it
# once costs one pass and some disk, and a tile then reads only its own slice.
#
# The tiling exists because preparation holds the whole region's index in RAM.
# Tiles bound that by construction, and the merge is exact — verified against a
# whole-region build: identical sections, identical evidence, byte-identical
# geometry.
#
# The tiling script lives in the repository and is mounted from a ConfigMap so
# there is one copy of it:
#
#   kubectl -n openlooper create configmap openlooper-tile-script \
#     --from-file=tile_region.sh=docker/evidence/tile_region.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n openlooper delete job openlooper-evidence-prepare --ignore-not-found
#   kubectl -n openlooper apply -f k8s/52-evidence-prepare-job.yaml
#   kubectl -n openlooper logs -f job/openlooper-evidence-prepare
#
# It writes route-use-evidence.sqlite.next rather than replacing the live file:
# the running service holds the current database open, and swapping it under a
# live pod leaves that pod serving the old inode. Promote it with the swap in
# docs/deployment.md once the Job has succeeded.
apiVersion: batch/v1
kind: Job
metadata:
  name: openlooper-evidence-prepare
  namespace: openlooper
spec:
  backoffLimit: 0
  # 24 hours. Every step keeps its finished work, so a re-run after this
  # resumes; it is here to stop a wedged Job holding the node indefinitely.
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch-gps
          image: curlimages/curl:8.11.1
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              archive=/gps/gpx-planet-2013-04-09.tar.xz
              url=https://planet.openstreetmap.org/gps/gpx-planet-2013-04-09.tar.xz
              mkdir -p /gps
              # The marker holds the verified md5, so it is non-empty and -s
              # actually tells us something. It used to be written with touch,
              # which creates an empty file: -s was never true and every run
              # re-hashed 21 GB for nothing.
              if [ -s "$archive.verified" ]; then
                echo "Archive already downloaded and verified ($(cat "$archive.verified"))."
                exit 0
              fi
              # Roughly 21 GB. --continue-at resumes a partial download; unlike
              # the Geofabrik extracts this archive is a fixed 2013 file that
              # never changes, so resuming can never splice two versions. Skip
              # the request entirely when the file is already the right size,
              # because asking for a range past the end is an error.
              remote=$(curl --fail --silent --show-error --location --head "$url" \
                       | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v+0}' || echo 0)
              have=$([ -f "$archive" ] && wc -c < "$archive" || echo 0)
              if [ "$remote" -gt 0 ] && [ "$have" -eq "$remote" ]; then
                echo "Archive already complete ($have bytes); verifying it."
              else
                curl --fail --location --retry 5 --connect-timeout 20 \
                     --continue-at - --output "$archive" "$url"
              fi
              curl --fail --location --retry 5 --output "$archive.md5" "$url.md5"
              # Hours of matching against a corrupt archive would be wasted, and
              # the failure would look like thin evidence rather than a bad
              # download, so verify before anything else reads it.
              expected=$(awk '{print $1; exit}' "$archive.md5")
              actual=$(md5sum "$archive" | awk '{print $1}')
              echo "expected $expected"
              echo "actual   $actual"
              [ "$expected" = "$actual" ]
              printf '%s' "$actual" > "$archive.verified"
          volumeMounts:
            - name: gps-archive
              mountPath: /gps

        - name: prefilter
          image: rpattn/openlooper-evidence:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              if [ -s /gps/filtered.tar ] && [ -s /gps/filtered.provenance.json ]; then
                echo "Prefiltered intermediate already present; keeping it."
                echo "Delete /gps/filtered.tar to redo this after changing the region."
                exit 0
              fi
              python /app/prefilter_gps.py \
                --gps-archive /gps/gpx-planet-2013-04-09.tar.xz \
                --output /gps/filtered.tar \
                --provenance /gps/filtered.provenance.json \
                --bbox="$(cat /config/evidence-bbox)"
          volumeMounts:
            - name: gps-archive
              mountPath: /gps
            - name: region
              mountPath: /config
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 2Gi

        - name: tile
          image: iboates/osmium:1.18.0
          command: ["/bin/sh", "/scripts/tile_region.sh"]
          args:
            - /evidence/evidence-region.osm.pbf
            - /evidence/tiles
            - $(EVIDENCE_BBOX)
            - $(TILE_COLS)
            - $(TILE_ROWS)
            - $(TILE_MARGIN)
            - $(TILE_MAX_BYTES)
          env:
            - name: EVIDENCE_BBOX
              valueFrom:
                configMapKeyRef: { name: openlooper-region, key: evidence-bbox }
            - name: TILE_COLS
              valueFrom:
                configMapKeyRef: { name: openlooper-region, key: tile-cols }
            - name: TILE_ROWS
              valueFrom:
                configMapKeyRef: { name: openlooper-region, key: tile-rows }
            - name: TILE_MARGIN
              valueFrom:
                configMapKeyRef: { name: openlooper-region, key: tile-margin }
            - name: TILE_MAX_BYTES
              valueFrom:
                configMapKeyRef: { name: openlooper-region, key: tile-max-bytes }
          volumeMounts:
            - name: evidence-data
              mountPath: /evidence
            - name: tile-script
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 6Gi

        - name: partition
          image: rpattn/openlooper-evidence:latest
          imagePullPolicy: Always
          command: ["python", "/app/partition_gps.py"]
          args:
            - --gps-archive=/gps/filtered.tar
            - --manifest=/evidence/tiles/manifest.tsv
            - --out-dir=/evidence/tiles
          volumeMounts:
            - name: gps-archive
              mountPath: /gps
              readOnly: true
            - name: evidence-data
              mountPath: /evidence
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            # Holds one open tar writer per tile plus a member at a time, so
            # this is bounded by tile count rather than by the archive.
            limits:
              memory: 4Gi

      containers:
        - name: build
          image: rpattn/openlooper-evidence:latest
          imagePullPolicy: Always
          command: ["/app/build_tiles.sh"]
          args:
            - /evidence/tiles
            - /evidence/evidence-region.osm.pbf
            - /gps/filtered.tar
            - /gps/filtered.provenance.json
            - /evidence/route-use-evidence.sqlite.next
            - /evidence/build-report.json.next
            # "auto" lets prepare_evidence.py size the pool from the cores it
            # can actually see, rather than a number written on a different
            # machine. Reading the intermediate is serial and sets the floor, so
            # oversubscribing buys nothing.
            - auto
          volumeMounts:
            - name: evidence-data
              mountPath: /evidence
            - name: gps-archive
              mountPath: /gps
              readOnly: true
          resources:
            requests:
              # A scheduling floor, not a cap. There is no CPU limit, so the
              # build uses whatever the node has spare anyway; asking for more
              # here only risks the pod sitting Pending forever on a small node
              # beside Valhalla and whatever else the cluster runs.
              cpu: "1"
              memory: 4Gi
            # Peak is set by the largest tile, not the region: preparation runs
            # about 29x a tile's PBF for the network phase and roughly 50x for a
            # full build. The tiling step prints a projection per tile — raise
            # tile-cols/tile-rows rather than this, which is already most of a
            # 16 GB node.
            limits:
              memory: 12Gi
      volumes:
        - name: evidence-data
          hostPath:
            path: /srv/openlooper/evidence
            type: Directory
        - name: gps-archive
          hostPath:
            path: /srv/openlooper/gps
            type: DirectoryOrCreate
        - name: tile-script
          configMap:
            name: openlooper-tile-script
        # The prefilter reads evidence-bbox from here; the tile step takes the
        # same values as env vars instead.
        - name: region
          configMap:
            name: openlooper-region
