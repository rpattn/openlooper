# Two regions, not one.
#
# Valhalla and the evidence service have completely different cost profiles.
# Routing tiles are built once and then memory-mapped, so a graph can cover far
# more ground than a 32 GB box could ever build evidence for: evidence
# preparation holds an STRtree over every highway way plus a per-section dict in
# RAM, and that measured 2.04 GiB for a 71 MB regional PBF.
#
# So routing gets one PBF and evidence gets a sub-region cut out of it. The
# evidence service only ever checks that the PBF mounted beside its database is
# the one the database was built from — nothing requires that to be the same
# file Valhalla routes on. Cutting the evidence region out of the routing
# download with `osmium extract` keeps both at the same OSM vintage, so way IDs
# and geometry agree wherever they overlap. Outside the evidence region there is
# simply no evidence, which is already what the app means by unknown.
#
# The 27700 constraint binds the evidence region only. Valhalla has no such
# projection, so the routing region can be the whole United Kingdom, Northern
# Ireland included; just do not put the evidence bbox over Northern Ireland,
# where British National Grid coordinates are meaningless.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openlooper-region
  namespace: openlooper
data:
  # ---- Routing region ------------------------------------------------------
  # A single Geofabrik extract, used as-is. Leave empty to merge the county
  # list below instead.
  #
  #   united-kingdom     2.10 GB   the whole UK, Northern Ireland included
  #   great-britain      2.02 GB   England, Scotland and Wales only
  #   england            1.58 GB
  #   (empty)            merge `counties`
  #
  # Either UK-wide option is roughly 5.3 GB of tiles and many hours to build,
  # plus about 2 GB of elevation downloaded during that build.
  routing-url: https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf

  # Used only when routing-url is empty. Geofabrik splits England by county.
  counties: |
    staffordshire
    derbyshire
  base-url: https://download.geofabrik.de/europe/united-kingdom/england

  # ---- Evidence sub-region -------------------------------------------------
  # west,south,east,north. Cut from the routing PBF with `osmium extract`.
  # Leave empty to prepare evidence for the whole routing region — only do that
  # if the routing region is small enough to fit in RAM, which a UK-wide one is
  # not: in one process it would need roughly 100 GiB and this node has 16 GB.
  # See "Why not the whole UK" in docs/deployment.md for what would change that.
  #
  # This is a 16 GB node. Peak preparation memory runs about 29x the evidence
  # PBF for the network phase and roughly 50x for a full build, so a 12 Gi Job
  # ceiling puts the limit near 240 MB of PBF — about 3x the two-county
  # prototype, not the whole Midlands.
  #
  # The prepare Job prints the extract's size and a projected peak before it
  # hands over. Widen this, run that Job, read the number, and only then start
  # a build that takes most of a day.
  #
  # The default covers Staffordshire, Derbyshire and their immediate
  # neighbours — the southern Peak, Cannock Chase and Charnwood.
  evidence-bbox: "-2.85,52.35,-1.05,53.45"
