# Optional, and usually not what you want. If the cluster already runs a
# cloudflared, skip this file entirely and use k8s/35-ingress.yaml instead:
# add a public hostname to the existing tunnel and let it reach the app through
# the ingress controller, the same way every other host on the cluster works.
#
# This file is for a cluster with no tunnel of its own. It points a dedicated
# cloudflared straight at the Service, bypassing any ingress.
#
# Create the token secret first, from Zero Trust > Networks > Tunnels:
#   kubectl -n openlooper create secret generic cloudflared-token \
#     --from-literal=token='<the connector token>'
#
# The tunnel terminates TLS at Cloudflare, which the browser geolocation API
# requires: served over plain HTTP the "use my location" control silently does
# nothing outside localhost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: openlooper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
