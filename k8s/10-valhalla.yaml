# Valhalla serves the routing graph that was prepared on the node. The upstream
# scripted image will happily rebuild tiles from the PBF, which takes hours, so
# force_rebuild stays off and a prepared /srv/openlooper/valhalla is a
# precondition rather than something this Deployment creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlooper-valhalla
  namespace: openlooper
spec:
  replicas: 1
  # The graph directory is a single hostPath opened read-write by the server, so
  # two pods must never overlap during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openlooper-valhalla
  template:
    metadata:
      labels:
        app: openlooper-valhalla
    spec:
      containers:
        - name: valhalla
          image: ghcr.io/valhalla/valhalla-scripted:3.8.3
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: tile_urls
              value: /custom_files/local-region.osm.pbf
            - name: use_tiles_ignore_pbf
              value: "False"
            - name: force_rebuild
              value: "False"
            - name: build_elevation
              value: "True"
            - name: build_admins
              value: "True"
            - name: build_time_zones
              value: "True"
            - name: build_tar
              value: "True"
            - name: serve_tiles
              value: "True"
            - name: server_threads
              value: "4"
          volumeMounts:
            - name: routing-data
              mountPath: /custom_files
          # A start that finds no tiles builds them from the PBF first, and for
          # a GB-wide extract that is many hours including the elevation
          # download. A startup probe that gives up mid-build kills the
          # container and starts the whole build again, so this budget is
          # deliberately far longer than any real build: 960 x 30 s = 8 hours.
          # The cost of it being too generous is only that a genuinely wedged
          # start takes longer to notice, and the logs show that anyway.
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 960
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            # Building tiles and serving them cost wildly different amounts, and
            # this one container does both. Serving is memory-mapped and sits
            # near the 2 Gi request; the initial build of a GB-wide graph needs
            # far more, and an OOM kill mid-build throws away hours. Hence a
            # limit sized for the build rather than the steady state.
            #
            # This is a 16 GB node, so 12 Gi is most of it: the build must not
            # overlap the evidence prepare Job, which is allowed the same. Run
            # the two one after the other, never at the same time.
            limits:
              memory: 12Gi
      volumes:
        - name: routing-data
          hostPath:
            path: /srv/openlooper/valhalla
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: openlooper-valhalla
  namespace: openlooper
spec:
  selector:
    app: openlooper-valhalla
  ports:
    - name: http
      port: 8002
      targetPort: http
