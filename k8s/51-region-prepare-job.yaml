# Produces the two PBFs everything else derives from:
#
#   /srv/openlooper/valhalla/local-region.osm.pbf   what Valhalla routes on
#   /srv/openlooper/evidence/evidence-region.osm.pbf what evidence is built from
#
# The second is cut out of the first, so both are the same OSM vintage.
#
#   kubectl -n openlooper delete job openlooper-region-prepare --ignore-not-found
#   kubectl -n openlooper apply -f k8s/51-region-prepare-job.yaml
#   kubectl -n openlooper logs -f job/openlooper-region-prepare
#
# Then follow the region-change runbook in docs/deployment.md: the graph has to
# be rebuilt and the evidence database re-prepared before either serves the new
# area.
apiVersion: batch/v1
kind: Job
metadata:
  name: openlooper-region-prepare
  namespace: openlooper
spec:
  backoffLimit: 0
  # Downloads resume, so a re-run after a network failure is cheap; this only
  # stops a wedged Job from holding the node forever.
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: download
          image: curlimages/curl:8.11.1
          # The image defaults to uid 100, which cannot write the root-owned
          # hostPath directory.
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              mkdir -p /routing/sources
              fetch() {
                echo "==> $1"
                # Resuming an already-complete file asks for a range past its
                # end, which Geofabrik answers 416 and --fail turns into a
                # failed Job. Widening the evidence region re-runs this Job, so
                # compare sizes first and only download when they differ.
                # Never fatal: this only decides whether to skip a download.
                # Under set -e a failing probe would otherwise kill the script
                # silently, because --silent means it prints nothing either.
                # Falling through to the real download reports the actual error.
                remote=$(curl --fail --silent --show-error --location --head "$1" \
                         | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v+0}' \
                         || echo 0)
                have=$([ -f "$2" ] && wc -c < "$2" || echo 0)
                if [ "$remote" -gt 0 ] && [ "$have" -eq "$remote" ]; then
                  echo "    already complete ($have bytes); delete it to refresh"
                else
                  # --continue-at resumes a partial file; Geofabrik supports
                  # ranges, so an interrupted download does not start over.
                  curl --fail --location --retry 5 --connect-timeout 20 \
                       --continue-at - --remote-time --output "$2" "$1"
                fi
                ls -l "$2"
              }
              echo "curl $(curl --version | head -1)"
              url="$(cat /config/routing-url)"
              echo "routing-url: ${url:-<empty, will merge the county list>}"
              if [ -n "$url" ]; then
                fetch "$url" /routing/sources/routing-source.osm.pbf
              else
                base="$(cat /config/base-url)"
                while read -r county; do
                  [ -n "$county" ] || continue
                  fetch "${base}/${county}-latest.osm.pbf" \
                        "/routing/sources/${county}-latest.osm.pbf"
                done < /config/counties
              fi
          volumeMounts:
            - name: routing-data
              mountPath: /routing
            - name: region
              mountPath: /config
      containers:
        - name: extract
          image: iboates/osmium:1.18.0
          # The image's entrypoint is osmium itself, so the shell has to be
          # named explicitly to branch on the ConfigMap.
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              echo "curl $(curl --version | head -1)"
              url="$(cat /config/routing-url)"
              echo "routing-url: ${url:-<empty, will merge the county list>}"
              if [ -n "$url" ]; then
                # One extract, used as-is. `cat` rather than `mv` so a re-run
                # does not consume the resumable download.
                osmium fileinfo /routing/sources/routing-source.osm.pbf > /dev/null
                cat /routing/sources/routing-source.osm.pbf > /routing/local-region.osm.pbf
              else
                set --
                while read -r county; do
                  [ -n "$county" ] || continue
                  osmium fileinfo "/routing/sources/${county}-latest.osm.pbf" > /dev/null
                  set -- "$@" "/routing/sources/${county}-latest.osm.pbf"
                done < /config/counties
                echo "Merging $# extract(s)…"
                osmium merge --overwrite "$@" -o /routing/local-region.osm.pbf
              fi

              bbox="$(cat /config/evidence-bbox)"
              if [ -n "$bbox" ]; then
                echo "Cutting the evidence region ($bbox) out of the routing PBF…"
                # complete_ways keeps every way that crosses the boundary whole,
                # so sections are not silently truncated at the edge.
                osmium extract --overwrite --bbox "$bbox" --strategy complete_ways \
                  /routing/local-region.osm.pbf -o /evidence/evidence-region.osm.pbf
              else
                echo "No evidence bbox set: evidence covers the whole routing region."
                cat /routing/local-region.osm.pbf > /evidence/evidence-region.osm.pbf
              fi

              echo
              echo "Routing PBF   $(ls -l /routing/local-region.osm.pbf | awk '{print $5}') bytes"
              echo "Evidence PBF  $(ls -l /evidence/evidence-region.osm.pbf | awk '{print $5}') bytes"
              echo
              # Preparation memory runs about 29x the evidence PBF. Well past
              # the Job's 24 GiB ceiling is worth knowing before starting a
              # multi-hour build that ends in an OOM kill.
              awk -v b="$(ls -l /evidence/evidence-region.osm.pbf | awk '{print $5}')" \
                'BEGIN { printf "Projected evidence preparation peak: %.1f GiB\n", b*29/1073741824 }'
              sha256sum /routing/local-region.osm.pbf /evidence/evidence-region.osm.pbf
          volumeMounts:
            - name: routing-data
              mountPath: /routing
            - name: evidence-data
              mountPath: /evidence
            - name: region
              mountPath: /config
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 8Gi
      volumes:
        - name: routing-data
          hostPath:
            path: /srv/openlooper/valhalla
            type: Directory
        - name: evidence-data
          hostPath:
            path: /srv/openlooper/evidence
            type: Directory
        - name: region
          configMap:
            name: openlooper-region
