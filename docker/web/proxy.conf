proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# Loop generation fans out a wave of Valhalla requests and one evidence batch.
# Cloudflare's own origin timeout is 100 s, so failing later than that would
# only ever be seen as a 524 from the edge.
proxy_connect_timeout 10s;
proxy_send_timeout 95s;
proxy_read_timeout 95s;
# Evidence viewport responses are large GeoJSON bodies; streaming them straight
# through avoids nginx spilling them to disk before the browser sees anything.
proxy_buffering off;
