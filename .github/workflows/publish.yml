# Builds the two images OpenLooper actually ships and pushes them to Docker Hub.
# Valhalla is not built here: it runs the upstream ghcr.io/valhalla/valhalla-scripted
# image and gets its region from the graph prepared on the node, not from a layer.
#
# Deployment stays manual. After a green run, on the k3s node:
#   kubectl -n openlooper rollout restart deploy/openlooper-web deploy/openlooper-evidence
#
# One repository secret is required:
#
#   DOCKERHUB_TOKEN   Docker Hub > Account settings > Personal access tokens,
#                     with Read & Write scope. It must be a *repository* secret
#                     (Settings > Secrets and variables > Actions), not a
#                     variable and not an environment secret, or it resolves to
#                     empty and login fails with "Password required".
#
# The account name is not a secret: it is already in the k8s manifests, and
# keeping it in one masks every image name in the logs as ***.
name: publish

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: rpattn

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      # One failing image should not hide whether the other one builds.
      fail-fast: false
      matrix:
        include:
          - name: openlooper-web
            # The Expo client imports shared code from src/, so its build
            # context is the repository root rather than its own directory.
            context: .
            dockerfile: docker/web/Dockerfile
          - name: openlooper-evidence
            context: docker/evidence
            dockerfile: docker/evidence/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Fail here with a readable message rather than inside login-action,
      # which only says "Password required".
      - name: Check the Docker Hub token is present
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set. Add it under Settings >" \
                 "Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-architecture on purpose: the homelab node is amd64, and
          # cross-building the Expo bundle under QEMU roughly triples the run.
          # Add linux/arm64 here if the node ever changes.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
