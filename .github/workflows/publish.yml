# Builds the two images OpenLooper actually ships and pushes them to Docker Hub.
# Valhalla is not built here: it runs the upstream ghcr.io/valhalla/valhalla-scripted
# image and gets its region from the graph prepared on the node, not from a layer.
#
# Deployment stays manual. After a green run, on the k3s node:
#   kubectl -n openlooper rollout restart deploy/openlooper-web deploy/openlooper-evidence
#
# Repository secrets required:
#   DOCKERHUB_USERNAME  Docker Hub account name
#   DOCKERHUB_TOKEN     an access token from Docker Hub > Account settings > Personal access tokens
name: publish

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      # One failing image should not hide whether the other one builds.
      fail-fast: false
      matrix:
        include:
          - name: openlooper-web
            # The Expo client imports shared code from src/, so its build
            # context is the repository root rather than its own directory.
            context: .
            dockerfile: docker/web/Dockerfile
          - name: openlooper-evidence
            context: docker/evidence
            dockerfile: docker/evidence/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-architecture on purpose: the homelab node is amd64, and
          # cross-building the Expo bundle under QEMU roughly triples the run.
          # Add linux/arm64 here if the node ever changes.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
